<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>受験番長</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="novel-shell" aria-labelledby="game-title">
      <section class="novel-stage" aria-label="受験番長 ゲーム画面">
        <header class="top-hud">
          <div class="title-lockup">
            <p class="eyebrow">JUKEN BANCHO / AFTER SCHOOL</p>
            <h1 id="game-title">受験番長</h1>
          </div>
          <div class="system-controls" aria-label="システム操作">
            <button id="skipIntroButton" class="hud-button" type="button" hidden>導入スキップ</button>
            <button id="endingBookButton" class="hud-button" type="button">結末帳</button>
            <button id="eventGalleryButton" class="hud-button" type="button" hidden>回想帳</button>
            <button id="studyReviewButton" class="hud-button" type="button">復習帳</button>
            <button id="bgmButton" class="hud-button" type="button" aria-pressed="false">BGM OFF</button>
            <button id="sfxButton" class="hud-button" type="button" aria-pressed="true">効果音ON</button>
            <label class="volume-control">
              <span>音量</span>
              <input id="volumeSlider" type="range" min="0" max="100" value="32" />
            </label>
            <button id="restartTopButton" class="hud-button" type="button">最初から</button>
          </div>
        </header>

        <aside id="statsHud" class="stats-hud" aria-label="現在のステータス">
          <p id="turnText" class="turn-text"></p>
          <div id="statsGrid" class="stats-grid"></div>
        </aside>

        <section id="endingBookPanel" class="ending-book collection-page" aria-label="解放済みの結末" hidden>
          <div class="ending-book__header">
            <div>
              <p class="scene-tag">結末帳</p>
              <p id="endingBookCount" class="ending-book__count"></p>
            </div>
            <div class="collection-page__actions">
              <button id="endingBookBackButton" class="hud-button hud-button--compact" type="button">戻る</button>
              <button id="endingBookClearButton" class="hud-button hud-button--compact" type="button">記録消去</button>
            </div>
          </div>
          <div id="endingBookList" class="ending-book__list"></div>
        </section>

        <section id="eventGalleryPanel" class="ending-book event-gallery collection-page" aria-label="回収済みのイベント一枚絵" hidden>
          <div class="ending-book__header">
            <div>
              <p class="scene-tag">回想帳</p>
              <p id="eventGalleryCount" class="ending-book__count"></p>
            </div>
            <div class="collection-page__actions">
              <button id="eventGalleryBackButton" class="hud-button hud-button--compact" type="button">戻る</button>
              <button id="eventGalleryClearButton" class="hud-button hud-button--compact" type="button">回想消去</button>
            </div>
          </div>
          <div id="eventGalleryList" class="ending-book__list cg-gallery-list"></div>
        </section>

        <section id="studyReviewPanel" class="ending-book study-review collection-page" aria-label="出題済み問題の復習" hidden>
          <div class="ending-book__header">
            <div>
              <p class="scene-tag">復習帳</p>
              <p id="studyReviewCount" class="ending-book__count"></p>
            </div>
            <div class="collection-page__actions">
              <button id="studyReviewBackButton" class="hud-button hud-button--compact" type="button">戻る</button>
              <button id="studyReviewClearButton" class="hud-button hud-button--compact" type="button">復習消去</button>
            </div>
          </div>
          <div id="studyReviewList" class="ending-book__list study-review-list"></div>
        </section>

        <section id="artworkViewer" class="artwork-viewer" aria-label="一枚絵全画面表示" hidden>
          <div class="artwork-viewer__bar">
            <div>
              <p id="artworkViewerLabel" class="scene-tag">一枚絵</p>
              <p id="artworkViewerTitle" class="artwork-viewer__title"></p>
            </div>
            <button id="artworkBackButton" class="hud-button hud-button--compact" type="button">戻る</button>
          </div>
          <img id="artworkViewerImage" class="artwork-viewer__image" alt="" decoding="async" />
          <p id="artworkViewerBody" class="artwork-viewer__body"></p>
        </section>

        <div class="scene-backdrop" aria-hidden="true">
          <div class="school-building"></div>
          <div class="school-windows"></div>
          <div class="sun-slash"></div>
        </div>

        <img
          id="characterSprite"
          class="character-sprite character-sprite--bancho"
          src="./assets/images/protagonist-bancho-transparent.png"
          alt="白い鉢巻きを巻き、学ラン姿で参考書とシャープペンを構える受験番長"
          decoding="async"
        />

        <img
          id="profileCompareSprite"
          class="character-sprite character-sprite--profile-gyaru"
          src="./assets/images/protagonists/gyaru-protagonist-transparent.png"
          alt="参考書とシャープペンを持ち、カーディガン姿で笑う優等生ギャル"
          decoding="async"
          hidden
        />

        <img id="endingArtwork" class="ending-artwork" alt="" decoding="async" hidden />

        <section class="dialogue-box" aria-live="polite">
          <div class="speaker-row">
            <p id="speakerName" class="speaker-name">受験番長</p>
            <p id="sceneTag" class="scene-tag">放課後</p>
          </div>
          <p id="dialogueText" class="dialogue-text"></p>
          <div id="choiceList" class="choice-list"></div>
          <button id="advanceButton" class="advance-button" type="button" hidden>次へ</button>
        </section>
      </section>

      <p class="credit">
        BGM素材: OpenGameArt.org / CC0
      </p>
    </main>

    <audio id="bgmAudio" loop preload="none"></audio>

    <script type="module" src="./app.js"></script>
  </body>
</html>
